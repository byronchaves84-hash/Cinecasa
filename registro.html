<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>CINEMAX — Crear cuenta</title>

    <link
        rel="stylesheet"
        href="registro.css"
    >

</head>


<body>


    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div class="background"></div>

    <div class="background-overlay"></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <a
            href="login.html"
            class="logo"
        >
            CINEMAX
        </a>

    </header>


    <!-- =====================================================
         REGISTRO
    ====================================================== -->

    <main class="register-page">

        <section class="register-box">


            <div class="register-header">

                <h1>
                    Crear una cuenta
                </h1>

                <p>
                    Únete a CINEMAX y comienza tu experiencia.
                </p>

            </div>


            <!-- =================================================
                 MENSAJE DE ERROR / ÉXITO
            ================================================== -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- =================================================
                 FORMULARIO
            ================================================== -->

            <form
                id="registerForm"
                autocomplete="off"
            >


                <!-- USUARIO -->

                <div class="input-group">

                    <label for="username">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ej. Dario"
                        minlength="3"
                        maxlength="20"
                        required
                    >

                </div>


                <!-- CORREO -->

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Correo electrónico"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group password-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Contraseña"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                            class="show-password"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="input-group password-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repite tu contraseña"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="showConfirmPassword"
                            class="show-password"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    Crear cuenta
                </button>


            </form>


            <!-- =================================================
                 LOGIN
            ================================================== -->

            <div class="login-link">

                <span>
                    ¿Ya tienes una cuenta?
                </span>

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>


            <!-- =================================================
                 SEGURIDAD
            ================================================== -->

            <p class="security-text">

                Al crear una cuenta aceptas utilizar CINEMAX
                de forma responsable.

            </p>


        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        © 2026 CINEMAX — Todos los derechos reservados.

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ELEMENTOS
        ====================================================== */

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        const showConfirmPassword =
            document.getElementById(
                "showConfirmPassword"
            );


        /* =====================================================
           MOSTRAR / OCULTAR CONTRASEÑA
        ====================================================== */

        showPassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPassword.textContent =
                        "Ocultar";

                } else {

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "Mostrar";

                }

            }
        );


        showConfirmPassword.addEventListener(
            "click",
            function () {

                if (
                    confirmPasswordInput.type ===
                    "password"
                ) {

                    confirmPasswordInput.type =
                        "text";

                    showConfirmPassword.textContent =
                        "Ocultar";

                } else {

                    confirmPasswordInput.type =
                        "password";

                    showConfirmPassword.textContent =
                        "Mostrar";

                }

            }
        );


        /* =====================================================
           MENSAJES
        ====================================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message show " + type;

        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "message";

        }


        /* =====================================================
           REGISTRO
           
           AHORA:
           registro.html
                ↓
           POST /api/users/register
                ↓
           server.py
                ↓
           users.json
        ====================================================== */

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                clearMessage();


                /* =============================================
                   DATOS
                ============================================= */

                const username =
                    usernameInput.value
                    .trim();


                const email =
                    emailInput.value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                /* =============================================
                   VALIDAR USUARIO
                ============================================= */

                if (
                    username.length < 3
                ) {

                    showMessage(
                        "El nombre de usuario debe tener al menos 3 caracteres.",
                        "error"
                    );

                    return;

                }


                /* =============================================
                   VALIDAR CONTRASEÑA
                ============================================= */

                if (
                    password.length < 6
                ) {

                    showMessage(
                        "La contraseña debe tener al menos 6 caracteres.",
                        "error"
                    );

                    return;

                }


                /* =============================================
                   CONFIRMAR CONTRASEÑA
                ============================================= */

                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Las contraseñas no coinciden.",
                        "error"
                    );

                    return;

                }


                /* =============================================
                   BLOQUEAR BOTÓN
                ============================================= */

                registerButton.disabled =
                    true;

                registerButton.textContent =
                    "Creando cuenta...";


                /* =============================================
                   ENVIAR AL SERVIDOR
                ============================================= */

                try {

                    const response =
                        await fetch(
                            "/api/users/register",
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        {
                                            username:
                                                username,

                                            email:
                                                email,

                                            password:
                                                password
                                        }
                                    )
                            }
                        );


                    const result =
                        await response.json();


                    /* =========================================
                       ERROR DEL SERVIDOR
                    ========================================= */

                    if (!response.ok) {

                        showMessage(
                            result.error ||
                            "No se pudo crear la cuenta.",
                            "error"
                        );

                        registerButton.disabled =
                            false;

                        registerButton.textContent =
                            "Crear cuenta";

                        return;

                    }


                    /* =========================================
                       ÉXITO
                    ========================================= */

                    showMessage(
                        "Cuenta creada correctamente. Redirigiendo...",
                        "success"
                    );


                    registerButton.textContent =
                        "Cuenta creada";


                    /* =========================================
                       VOLVER AL LOGIN
                    ========================================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1800
                    );


                } catch (error) {

                    console.error(
                        "Error registrando usuario:",
                        error
                    );


                    showMessage(
                        "No se pudo conectar con el servidor.",
                        "error"
                    );


                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Crear cuenta";

                }

            }
        );


        /* =====================================================
           QUITAR ERROR AL ESCRIBIR
        ====================================================== */

        usernameInput.addEventListener(
            "input",
            clearMessage
        );


        emailInput.addEventListener(
            "input",
            clearMessage
        );


        passwordInput.addEventListener(
            "input",
            clearMessage
        );


        confirmPasswordInput.addEventListener(
            "input",
            clearMessage
        );


    </script>


</body>

</html>
